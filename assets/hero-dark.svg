<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .sans { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  </style>

  <rect width="1200" height="260" fill="#14171C"/>
  <rect x="6" y="6" width="1188" height="248" rx="8" fill="none" stroke="#2A2E35" stroke-width="1.2"/>

  <!-- corner registration ticks -->
  <path d="M6,26 L6,10 L22,10" fill="none" stroke="#C9803F" stroke-width="2"/>
  <path d="M1178,10 L1194,10 L1194,26" fill="none" stroke="#C9803F" stroke-width="2"/>
  <path d="M6,234 L6,250 L22,250" fill="none" stroke="#C9803F" stroke-width="2"/>
  <path d="M1178,250 L1194,250 L1194,234" fill="none" stroke="#C9803F" stroke-width="2"/>

  <!-- title-block header strip -->
  <text x="32" y="34" class="mono" font-size="10.5" letter-spacing="0.5" fill="#8B8F97">Systems engineering × applied AI</text>
  <text x="1168" y="34" text-anchor="end" class="mono" font-size="10.5" letter-spacing="0.5" fill="#8B8F97">Rev 2026.09</text>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#2A2E35" stroke-width="1"/>

  <!-- name -->
  <text x="32" y="120" class="sans" font-weight="700" font-size="46" fill="#E8E6DF">Vignesh Manivasakam</text>
  <line x1="32" y1="133" x2="32" y2="133" stroke="#C9803F" stroke-width="3">
    <animate attributeName="x2" from="32" to="430" dur="1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </line>

  <!-- cycling tagline -->
  <g class="mono" font-size="19" fill="#5C87A6">
    <text x="34" y="168" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.32;0.37" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      Automotive Systems Engineer
    </text>
    <text x="34" y="168" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.42;0.65;0.70" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      Applied AI Lead, Requirements Engineering
    </text>
    <text x="34" y="168" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.75;0.98;1" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      Bridging EPS / Steer-by-Wire with agentic AI
    </text>
  </g>

  <line x1="32" y1="214" x2="1168" y2="214" stroke="#2A2E35" stroke-width="1"/>
  <text x="32" y="234" class="mono" font-size="10.5" fill="#8B8F97">Coimbatore, India — open to relocate worldwide</text>
  <text x="1168" y="234" text-anchor="end" class="mono" font-size="10.5" fill="#8B8F97">IREB CPRE-FL · IBM RAG &amp; Agentic AI Certified</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .sans { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  </style>

  <rect width="1200" height="480" fill="#14171C"/>
  <rect x="6" y="6" width="1188" height="468" rx="8" fill="none" stroke="#2A2E35" stroke-width="1.2"/>
  <path d="M6,26 L6,10 L22,10" fill="none" stroke="#C9803F" stroke-width="2"/>
  <path d="M1178,10 L1194,10 L1194,26" fill="none" stroke="#C9803F" stroke-width="2"/>
  <path d="M6,454 L6,470 L22,470" fill="none" stroke="#C9803F" stroke-width="2"/>
  <path d="M1178,470 L1194,470 L1194,454" fill="none" stroke="#C9803F" stroke-width="2"/>

  <!-- title strip -->
  <text x="32" y="34" class="mono" font-size="10.5" fill="#8B8F97">Bosch Global Software Technologies · 2023–Present</text>
  <text x="1168" y="34" text-anchor="end" class="mono" font-size="10.5" fill="#8B8F97">Rev 2026.09</text>
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#2A2E35" stroke-width="1"/>
  <text x="32" y="72" class="sans" font-weight="700" font-size="20" fill="#E8E6DF">Where the AI tools sit in the automotive V-model</text>


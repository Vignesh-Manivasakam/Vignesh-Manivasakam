    <text x="790" y="323" class="mono" font-size="10.5" fill="#8B8F97">ISO 26262 · SOTIF verification</text>
    <text x="790" y="339" class="mono" font-weight="600" font-size="11" fill="#7FA687">&gt;90% recall · 60% faster review</text>
    <text x="790" y="355" class="mono" font-size="10" fill="#D9A441">● poc</text>
  </g>

  <!-- impact ledger -->
  <line x1="32" y1="400" x2="1168" y2="400" stroke="#2A2E35" stroke-width="1"/>
  <line x1="410" y1="410" x2="410" y2="452" stroke="#2A2E35" stroke-width="1"/>
  <line x1="790" y1="410" x2="790" y2="452" stroke="#2A2E35" stroke-width="1"/>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
    <text x="220" y="435" text-anchor="middle" class="sans" font-weight="700" font-size="26" fill="#C9803F">$86,719</text>
    <text x="220" y="452" text-anchor="middle" class="mono" font-size="10" fill="#8B8F97">verified cost avoidance</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/>
    <text x="600" y="435" text-anchor="middle" class="sans" font-weight="700" font-size="26" fill="#C9803F">2,760+</text>
    <text x="600" y="452" text-anchor="middle" class="mono" font-size="10" fill="#8B8F97">engineering hours saved</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.3s" fill="freeze"/>
    <text x="980" y="435" text-anchor="middle" class="sans" font-weight="700" font-size="26" fill="#C9803F">10–15</text>

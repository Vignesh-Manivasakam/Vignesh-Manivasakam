    <animate attributeName="stroke-dashoffset" from="1040" to="0" dur="1.4s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
  </polyline>

  <!-- quiet nodes: Architecture, Implementation, Integration test, Release -->
  <g fill="#3A3F47" stroke="#5C87A6" stroke-width="1.5">
    <circle cx="460" cy="240" r="0" opacity="0"><animate attributeName="r" from="0" to="6" dur="0.3s" begin="0.5s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s" fill="freeze"/></circle>
    <circle cx="600" cy="270" r="0" opacity="0"><animate attributeName="r" from="0" to="6" dur="0.3s" begin="0.72s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.72s" fill="freeze"/></circle>
    <circle cx="740" cy="240" r="0" opacity="0"><animate attributeName="r" from="0" to="6" dur="0.3s" begin="0.89s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.89s" fill="freeze"/></circle>
    <circle cx="1100" cy="140" r="0" opacity="0"><animate attributeName="r" from="0" to="6" dur="0.3s" begin="1.4s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.4s" fill="freeze"/></circle>
  </g>
  <g class="mono" font-size="10.5" fill="#8B8F97" text-anchor="middle">
